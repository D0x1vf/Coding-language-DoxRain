[package]
name = "doxrain"
version = "0.5.0"
edition = "2021"
description = "DoxRain Cherokee experimental C-backed compiler-interpreter"
license = "AGPL-3.0"

[[bin]]
name = "doxrain"
path = "src/main.rs"

[build-dependencies]
cc = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
