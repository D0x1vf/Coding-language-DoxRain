use std::env;
use std::ffi::CString;
use std::process;

#[link(name = "doxrain_engine", kind = "static")]
extern "C" {
    fn doxrain_run_file(path: *const std::os::raw::c_char, check_only: i32) -> i32;
}

fn help() {
    println!("DoxRain 0.5.0 (experimental)");
    println!("C-backed compiler-interpreter test engine");
    println!();
    println!("Usage:");
    println!("  doxrain <file.dox>       Compile and run a DoxRain program");
    println!("  doxrain --check <file>   Compile without running");
    println!("  doxrain --version        Show the DoxRain test version");
    println!("  doxrain --help           Show this help");
}

fn main() {
    let args: Vec<String> = env::args().skip(1).collect();
    match args.as_slice() {
        [] => help(),
        [flag] if flag == "--help" || flag == "-h" => help(),
        [flag] if flag == "--version" || flag == "-V" => println!("DoxRain 0.5.0 (C hybrid experimental)"),
        [file] => run(file, 0),
        [flag, file] if flag == "--check" => run(file, 1),
        _ => { eprintln!("error[E000]: invalid arguments; use `doxrain --help`"); process::exit(2); }
    }
}

fn run(path: &str, check_only: i32) {
    let path = CString::new(path).unwrap_or_else(|_| {
        eprintln!("error[E001]: file path contains an invalid NUL character");
        process::exit(2);
    });
    let status = unsafe { doxrain_run_file(path.as_ptr(), check_only) };
    if status != 0 { process::exit(status); }
}
